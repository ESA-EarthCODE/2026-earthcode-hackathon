on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

# Shared with pr-preview.yml so a production publish and a PR preview
# deploy/remove never push to gh-pages at the same time -- concurrent
# pushes there can cause GitHub Pages to cancel/error one of the builds
# (seen when merging a PR triggers both workflows simultaneously).
concurrency: gh-pages-deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

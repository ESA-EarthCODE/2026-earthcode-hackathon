on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

name: PR Preview

# Shared with publish.yml so this never pushes to gh-pages at the same
# time as a production publish (see comment there). This does mean
# multiple PR previews deploy one at a time rather than in parallel,
# but none of them get cancelled -- they just queue.
concurrency: gh-pages-deploy

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        if: github.event.action != 'closed' # not needed if the preview is just going to be removed
        run: quarto render

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          # Only wait for the Pages deployment when actually deploying a
          # preview (so the sticky comment's link is live when posted).
          # Skip it on removal: nobody needs that link, and waiting here
          # is what turned a merely-superseded/racing build into a failed
          # job when a PR was closed by a merge.
          wait-for-pages-deployment: ${{ github.event.action != 'closed' }}
